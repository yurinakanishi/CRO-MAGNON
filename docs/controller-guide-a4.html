<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CRO-MAGNON コントローラー操作説明（A4 図解）</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #e9e6df; }
  body { font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 297mm; height: 210mm; overflow: hidden; page-break-after: always; break-after: page; background: #fff; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page svg { width: 297mm; height: 210mm; display: block; }
  @media screen { .page { margin: 8mm auto; box-shadow: 0 6px 24px rgba(0,0,0,.18); } }
</style>
</head>
<body>
<section class="page" id="ps4"></section>
<section class="page" id="switch"></section>
<section class="page" id="logitech"></section>

<script>
const W = 1414, H = 1000;
const FONT = "'Yu Gothic UI','Yu Gothic','Meiryo',sans-serif";
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// Colours follow actions; SHARE and the touchpad use the same map colour.
const ROLE = {
  lstick: '#2f7de1', rstick: '#0f9d8a', top: '#37a934', right: '#e5473f', left: '#d9469a',
  bottom: '#7d4ee0', mapBtn: '#d99a00', menuBtn: '#f07a1a',
};
const LIGHT = {
  lstick: '#eaf2fe', rstick: '#e6f7f4', top: '#ebf8e9', right: '#feecea', left: '#fde9f3',
  bottom: '#f1ebfd', mapBtn: '#fff7dd', menuBtn: '#fff0e3',
};
const MAP_DESCRIPTION = ['地図をひらく', ['もう一度おすと とじる']];

// Official product photographs. Crop only the surrounding whitespace in the
// SVG viewport; use ONE scale for both axes and for all arrow target positions.
const PHOTOS = {
  ps4: {
    file: 'dualshock-4.png', size: [1600, 900], crop: [315, 120, 980, 620],
    x: 330, y: 307, width: 735,
    caption: '写真：DUALSHOCK 4',
    source: 'https://www.playstation.com/en-ca/accessories/dualshock-4-wireless-controller/',
    targets: {
      mapBtn: [606, 214, 28], mapTouchpad: [805, 260, 60], menuBtn: [1004, 214, 28],
      top: [1107, 238, 35], right: [1180, 312, 35], bottom: [1107, 381, 35], left: [1038, 312, 35],
      lstick: [650, 441, 61], rstick: [960, 441, 61],
    },
  },
  switch: {
    file: 'switch-pro-front.png', size: [1000, 696], crop: [0, 0, 1000, 696],
    x: 347, y: 290, width: 710,
    caption: '写真：Nintendo Switch Proコントローラー',
    source: 'https://repo.mariocube.com/Marketing/Europe/GUIDELINES/NintendoSwitch_BrandGuide_EU-2_external_05092017_v3.pdf#page=30',
    targets: {
      mapBtn: [376, 134, 23], menuBtn: [624, 134, 23],
      top: [765, 141, 37], right: [842, 209, 37], bottom: [766, 279, 37], left: [687, 209, 37],
      lstick: [223, 211, 62], rstick: [632, 350, 60],
    },
  },
  logitech: {
    file: 'f310.png', size: [755, 556], crop: [32, 66, 697, 442],
    x: 330, y: 311, width: 735,
    caption: '写真：F310（F710は本体の色・一部のボタンが異なります）',
    source: 'https://www.logitechg.com/en-us/shop/p/f310-gamepad',
    targets: {
      mapBtn: [309, 193, 20], menuBtn: [448, 193, 20],
      top: [575, 194, 23], right: [627, 245, 23], bottom: [575, 295, 23], left: [525, 245, 23],
      lstick: [278, 354, 47], rstick: [478, 354, 47],
    },
  },
};
function photoTarget(photo, role) {
  const [cx, cy, cw] = photo.crop;
  const [x, y, radius] = photo.targets[role];
  const scale = photo.width / cw;
  return [photo.x + (x - cx) * scale, photo.y + (y - cy) * scale, radius * scale];
}
function controllerPhoto(photo) {
  const height = photo.width * photo.crop[3] / photo.crop[2];
  return `<svg class="controller-photo" x="${photo.x}" y="${photo.y}" width="${photo.width}" height="${height}" viewBox="${photo.crop.join(' ')}" preserveAspectRatio="xMidYMid meet" overflow="hidden">
    <image href="controller-guide-assets/${photo.file}" width="${photo.size[0]}" height="${photo.size[1]}" preserveAspectRatio="xMidYMid meet"/>
  </svg>`;
}

// ---------- callouts: one box with one or more arrows ----------
// target and box use page coordinates; photo targets keep the original aspect ratio.
function calloutArrow(color, target, box) {
  const [bx, by, bw, bh] = box;
  const [tx, ty] = target;
  const tr = target[2] + 6;
  const cx = bx + bw / 2, cy = by + bh / 2;
  // start: where the centre->target line leaves the box
  let dx = tx - cx, dy = ty - cy;
  const sx = Math.abs(dx) * bh > Math.abs(dy) * bw ? (bw / 2) / Math.abs(dx) : (bh / 2) / Math.abs(dy);
  const x0 = cx + dx * sx, y0 = cy + dy * sx;
  const len = Math.hypot(tx - x0, ty - y0), ux = (tx - x0) / len, uy = (ty - y0) / len;
  const ex = tx - ux * tr, ey = ty - uy * tr; // arrow tip on the button's rim
  const hl = 20, hw = 16;
  const lx = ex - ux * hl, ly = ey - uy * hl;
  const head = `${ex},${ey} ${lx - uy * hw / 2},${ly + ux * hw / 2} ${lx + uy * hw / 2},${ly - ux * hw / 2}`;
  return `<g class="callout-arrow">
    <line x1="${x0}" y1="${y0}" x2="${lx}" y2="${ly}" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
    <line x1="${x0}" y1="${y0}" x2="${lx}" y2="${ly}" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
    <polygon points="${head}" fill="${color}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x0}" cy="${y0}" r="7" fill="${color}" stroke="#fff" stroke-width="2"/>
  </g>`;
}
function callout(role, key, title, notes, targets, box, keyFont = 40) {
  const color = ROLE[role], light = LIGHT[role];
  const [bx, by, bw, bh] = box;
  const isWord = key.length > 1;
  const kf = isWord ? 24 : keyFont;
  const keyW = isWord ? [...key].reduce((w, ch) => w + kf * (ch.charCodeAt(0) > 0xff ? 1.0 : 0.68), 0) : kf * 1.05;
  const noteLines = notes.map((n, i) => `<text x="${bx + 18}" y="${by + 96 + i * 22}" font-size="16" fill="#3a4050" font-family="${FONT}">${esc(n)}</text>`).join('');
  return `<g class="callout" data-role="${role}">
    ${targets.map(target => calloutArrow(color, target, box)).join('')}
    <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="16" fill="${light}" stroke="${color}" stroke-width="4"/>
    <text x="${bx + 18}" y="${by + (isWord ? 34 : 54)}" font-size="${kf}" font-weight="900" fill="${color}" font-family="Segoe UI Symbol,${FONT}">${esc(key)}</text>
    <text x="${bx + 18 + (isWord ? 0 : keyW + 10)}" y="${by + (isWord ? 66 : 54)}" font-size="24" font-weight="800" fill="#1f2430" font-family="${FONT}">${esc(title)}</text>
    ${noteLines}</g>`;
}

// Standard positions (top row / right column / bottom row) shared by all three pages.
const BOX = {
  topLeft: [40, 118, 360, 140], topMiddle: [525, 118, 360, 140], topRight: [1014, 118, 360, 140],
  rightA: [1090, 420, 284, 140], rightB: [1090, 600, 284, 140],
  botA: [40, 820, 340, 140], botB: [420, 820, 330, 140], botC: [800, 820, 380, 140],
};

const PAGES = {
  ps4: {
    title: 'PS4 コントローラー（DUALSHOCK 4）', grad: ['#1d3fa0', '#2f7de1'], photo: PHOTOS.ps4,
    items: [
      ['mapBtn', 'SHARE / タッチパッド', ...MAP_DESCRIPTION, BOX.topLeft, ['mapBtn', 'mapTouchpad']],
      ['menuBtn', 'OPTIONS', 'メニュー', ['たべものを つかう', 'キャラクターを かえる'], BOX.topMiddle],
      ['top', '△', 'ジャンプ', ['あるきながらでも とべる'], BOX.topRight],
      ['right', '○', 'しらべる・とる', ['木・石・たき火・なかま・肉の', 'そばで。メニューでは「けってい」'], BOX.rightA],
      ['bottom', '×', 'のる・おりる', ['マンモス・ふね・大ざるのそば。', '524をなでる。メニューでは「もどる」'], BOX.rightB],
      ['lstick', '左スティック', 'あるく・はしる', ['あさくたおす ＝ あるく', 'ふかくたおす ＝ はしる'], BOX.botA],
      ['rstick', '右スティック', 'みる（カメラ）', ['おしこむと 視点をもどす'], BOX.botB],
      ['left', '□', 'こうげき', ['あいての方をむいて おす。', '地図では ピンを なかまに共有'], BOX.botC],
    ],
  },
  switch: {
    title: 'Nintendo Switch プロコントローラー', grad: ['#c8102e', '#f0433f'], photo: PHOTOS.switch,
    items: [
      ['mapBtn', '−', ...MAP_DESCRIPTION, BOX.topLeft],
      ['menuBtn', '＋', 'メニュー', ['たべものを つかう', 'キャラクターを かえる'], BOX.topMiddle],
      ['top', 'X', 'ジャンプ', ['あるきながらでも とべる'], BOX.topRight],
      ['right', 'A', 'しらべる・とる', ['木・石・たき火・なかま・肉の', 'そばで。メニューでは「けってい」'], BOX.rightA],
      ['bottom', 'B', 'のる・おりる', ['マンモス・ふね・大ざるのそば。', '524をなでる。メニューでは「もどる」'], BOX.rightB],
      ['lstick', '左スティック', 'あるく・はしる', ['あさくたおす ＝ あるく', 'ふかくたおす ＝ はしる'], BOX.botA],
      ['rstick', '右スティック', 'みる（カメラ）', ['おしこむと 視点をもどす'], BOX.botB],
      ['left', 'Y', 'こうげき', ['あいての方をむいて おす。', '地図では ピンを なかまに共有'], BOX.botC],
    ],
  },
  logitech: {
    title: 'Logicool ゲームパッド（F310 / F710）', grad: ['#0f766e', '#22b8a0'], photo: PHOTOS.logitech,
    items: [
      ['mapBtn', 'BACK', ...MAP_DESCRIPTION, BOX.topLeft],
      ['menuBtn', 'START', 'メニュー', ['たべものを つかう', 'キャラクターを かえる'], BOX.topMiddle],
      ['top', 'Y', 'ジャンプ', ['あるきながらでも とべる'], BOX.topRight],
      ['right', 'B', 'しらべる・とる', ['木・石・たき火・なかま・肉の', 'そばで。メニューでは「けってい」'], BOX.rightA],
      ['bottom', 'A', 'のる・おりる', ['マンモス・ふね・大ざるのそば。', '524をなでる。メニューでは「もどる」'], BOX.rightB],
      ['lstick', '左スティック', 'あるく・はしる', ['あさくたおす ＝ あるく', 'ふかくたおす ＝ はしる'], BOX.botA],
      ['rstick', '右スティック', 'みる（カメラ）', ['おしこむと 視点をもどす'], BOX.botB],
      ['left', 'X', 'こうげき', ['あいての方をむいて おす。', '地図では ピンを なかまに共有'], BOX.botC],
    ],
  },
};

function page(id) {
  const pg = PAGES[id];
  const parts = [];
  parts.push(`<defs><linearGradient id="g-${id}" x1="0" x2="1"><stop offset="0" stop-color="${pg.grad[0]}"/><stop offset="1" stop-color="${pg.grad[1]}"/></linearGradient></defs>`);
  parts.push(`<rect width="${W}" height="${H}" fill="#fff"/>`);
  parts.push(`<rect x="40" y="26" width="${W - 80}" height="70" rx="18" fill="url(#g-${id})"/>`);
  parts.push(`<text x="66" y="74" font-size="34" font-weight="900" fill="#fff" font-family="${FONT}">そうさ せつめい　${esc(pg.title)}</text>`);
  parts.push(`<text x="${W - 66}" y="72" text-anchor="end" font-size="18" font-weight="700" fill="#fff" opacity=".9" font-family="${FONT}">CRO-MAGNON</text>`);
  parts.push(controllerPhoto(pg.photo));
  for (const [role, key, title, notes, box, targetRoles = [role]] of pg.items) {
    parts.push(callout(role, key, title, notes, targetRoles.map(targetRole => photoTarget(pg.photo, targetRole)), box));
  }
  parts.push(`<a href="${pg.photo.source}"><text x="40" y="986" font-size="11" fill="#747b88" font-family="${FONT}">${esc(pg.photo.caption)}</text></a>`);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
}
for (const id of Object.keys(PAGES)) document.getElementById(id).innerHTML = page(id);
</script>
</body>
</html>
